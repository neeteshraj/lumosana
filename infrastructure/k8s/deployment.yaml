apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumosana-debugger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lumosana-debugger
  template:
    metadata:
      labels:
        app: lumosana-debugger
    spec:
      containers:
      - name: debugger
        image: lumosana-debugger:latest
        ports:
        - containerPort: 8080
        - containerPort: 50051
        envFrom:
        - configMapRef:
            name: lumosana-debugger-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
