# ---------------------------------------------
# Prometheus ConfigMap
# ---------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'transaction-debugger'
        static_configs:
          - targets: ['transaction-debugger-service:8080']
        metrics_path: '/metrics'
        scrape_interval: 10s

      - job_name: 'jaeger'
        static_configs:
          - targets: ['jaeger:14269']
        metrics_path: '/metrics'
        scrape_interval: 15s

      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector-service:8889']
        metrics_path: '/metrics'
        scrape_interval: 10s