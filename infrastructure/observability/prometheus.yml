global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Lumosana Debugger Service
  - job_name: 'transaction-debugger'
    static_configs:
      - targets: ['transaction-debugger:8080']
    scrape_interval: 5s
    metrics_path: '/metrics'

  # OpenTelemetry Collector (only exporter metrics)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s

  # Envoy Proxy
  - job_name: 'envoy'
    static_configs:
      - targets: ['envoy:9901']
    metrics_path: '/stats/prometheus'
    scrape_interval: 5s
