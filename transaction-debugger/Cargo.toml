[package]
name = "transaction-debugger"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.10", features = ["transport"] }
prost = "0.12"
solana-client = "1.18"
solana-transaction-status = "1.18"
solana-sdk = "1.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json"] }
sysinfo = "0.30"

[build-dependencies]
tonic-build = "0.10"
